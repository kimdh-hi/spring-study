spring:
  application:
    name: spring-elasticsearch
  datasource:
    url: jdbc:h2:mem:study
    driver-class-name: org.h2.Driver
    username: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
  elasticsearch:
    uris: http://localhost:9200

logging:
  level:
    org.springframework.data.elasticsearch.client.WIRE: TRACE
